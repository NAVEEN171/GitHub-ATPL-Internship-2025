<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Table</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="subscription-cards">
      <div class="subscription-card">
        <div class="subscription-details">
          <h2 class="header">Basic</h2>
          <h1>$0/mon</h1>
          <ul>
            <li>1 User</li>
            <li>4 web mails</li>
            <li>Responsive Website</li>
          </ul>
        </div>
        <button class="subscribe">Subscribe</button>
      </div>
      <div class="subscription-card">
        <div class="subscription-details">
          <h2 class="header">Standard</h2>
          <h1>$19/mon</h1>
          <ul>
            <li>4 User</li>
            <li>10 web mails</li>
            <li>Responsive Website</li>
            <li>SSL</li>
          </ul>
        </div>

        <button class="subscribe">Subscribe</button>
      </div>
      <div class="subscription-card">
        <div class="subscription-details">
          <h2 class="header">Premium</h2>
          <h1>$29/mon</h1>
          <ul>
            <li>Unlimited User</li>
            <li>Unlimited web mails</li>
            <li>Responsive Website</li>
            <li>Free SSL + SSO</li>
          </ul>
        </div>
        <button class="subscribe">Subscribe</button>
      </div>
    </section>
  </body>
</html>
