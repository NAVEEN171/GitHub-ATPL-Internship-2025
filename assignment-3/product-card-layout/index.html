<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card Layout</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <section class="product_card">
        <img
          class="Image"
          src="https://i.huffpost.com/gen/1105939/images/o-BEST-PERFORMING-WINDOWS-LAPTOP-facebook.jpg"
        />
        <div class="product_info">
          <p>Apple MacBook Air Laptop</p>
          <div class="stock-indicator">
            <div class="indicator"></div>
            <div class="indicator-text">Available</div>
          </div>
          <div class="amount">$ 800</div>
          <button class="buy-now-button">Buy Now</button>
        </div>
      </section>
    </main>
  </body>
</html>
