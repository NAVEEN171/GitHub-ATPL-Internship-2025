<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="temperature-converter.js" defer></script>
  </head>
  <body>
    <div class="converter-container">
      <h1>Temperature Converter</h1>

      <div class="input-section">
        <div class="input-group">
          <input type="number" class="temperature-input" value="0" step="0.1" />
          <span class="celsius-label">°C</span>
        </div>
        <button type="button" class="convert-button">Convert</button>
      </div>

      <div class="results-container">
        <div class="result-card">
          <div class="result-label">Fahrenheit</div>
          <span class="fahrenheit-result result-value">32</span>
          <div class="result-unit">°F</div>
        </div>

        <div class="result-card">
          <div class="result-label">Kelvin</div>
          <span class="kelvin-result result-value">273.15</span>
          <div class="result-unit">K</div>
        </div>
      </div>
    </div>
  </body>
</html>
