<div
  *ngIf="message.action"
  [ngClass]="message.action !== 'success' ? 'bg-red-200' : ''"
  class="fixed bottom-2 right-5 text-base font-bold min-w-[400px] p-3 bg-white border border-gray-200 shadow-xl rounded-lg"
>
  <div
    class="text-lg"
    [ngClass]="message.action === 'success' ? 'text-green-400' : 'text-red-400'"
  >
    {{ message.action }}
  </div>
  <div class="font-bold text-lg">{{ message.message }}</div>
</div>
