<div class="flex flex-col items-center">
  <h1 class="text-center text-2xl font-bold">Products</h1>
  <button
    class="bg-green-600 text-white rounded-lg font-semibold text-lg px-4 py-2 cursor-pointer mt-2"
  >
    Add new Product
  </button>
  <table>
    <thead>
      <tr>
        <th>id</th>
        <th>name</th>
        <th>Price</th>
        <th rowspan="2">Actions</th>
      </tr>
    </thead>
    <tbody>
      <ng-container class="py-3" *ngFor="let product of productsList">
        <tr class="">
          <td>{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.price }}</td>
          <td class="flex gap-2">
            <button
              class="w-fit bg-blue-400 text-white cursor-pointer rounded-sm font-semibold text-lg px-3 py-1"
              type="button"
            >
              Edit
            </button>
            <button
              type="button"
              class="w-fit bg-red-400 text-white cursor-pointer rounded-sm font-semibold text-lg px-3 py-1 disabled:bg-gray-200 disabled:text-black disabled:cursor-not-allowed"
            >
              Delete
            </button>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
