<h2>Child Component</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <ng-container>
      <tr *ngFor="let student of students">
        <th>{{ student }}</th>
        <th>
          <input
            class="student-check-box"
            [checked]="selectedStudent === student"
            type="checkbox"
            (click)="onCheckBoxChange($event, student)"
          />
        </th>
      </tr>
    </ng-container>
  </tbody>
</table>
