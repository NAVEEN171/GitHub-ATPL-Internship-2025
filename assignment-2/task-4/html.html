<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Questions</title>
</head>
<body>
    <section>
    <p>
1. Which of the following colors contain equal amounts of RBG?</p>

    <div>
        <input type="radio" 
               id="option1" 
               name="datatypes" 
               value="White">
        <label for="option1">White</label>
    </div>

    <div>
        <input type="radio" 
               id="option2" 
               name="datatypes" 
               value="Gray">
        <label for="option2">Gray</label>
    </div>

    <div>
        <input type="radio" 
               id="option3" 
               name="datatypes" 
               value="Black" checked>
        <label for="option3">Black</label>
    </div>
    <div>
        <input type="radio" 
               id="option4" 
               name="datatypes" 
               value="All of The Above" checked>
        <label for="option4">All of The Above</label>
    </div>
    </section>
    <section>
    <p>
2. What is the size of float and double in java?</p>

    <div>
        <input type="radio" 
               id="32 and 64" 
               name="size" 
               value="32 and 64">
        <label for="32 and 64">32 and 64</label>
    </div>

    <div>
        <input type="radio" 
               id="64_and_64" 
               name="size" 
               value="64 and 64">
        <label for="64 and 64">64 and 64</label>
    </div>

    <div>
        <input type="radio" 
               id="32 and 32" 
               name="size" 
               value="32 and 32" checked>
        <label for="32 and 32">32 and 32</label>
    </div>
    <div>
        <input type="radio" 
               id="64 and 32" 
               name="size" 
               value="64 and 32" checked>
        <label for="64 and 32">64 and 32</label>
    </div>
    </section>
    <section>
    <p>
3. Automatic type conversion is possible in which of the possible cases?</p>

    <div>
        <input type="radio" 
               id="byte to int" 
               name="type_conversion" 
               value="byte to int">
        <label for="byte to int">byte to int</label>
    </div>

    <div>
        <input type="radio" 
               id="Int to Long" 
               name="type_conversion" 
               value="Int to Long">
        <label for="Int to Long">Int to Long</label>
    </div>

    <div>
        <input type="radio" 
               id="Long to int" 
               name="type_conversion" 
               value="Long to int" checked>
        <label for="Long to int">Long to int</label>
    </div>
    <div>
        <input type="radio" 
               id="Short to int" 
               name="type_conversion" 
               value="Short to int" checked>
        <label for="Short to int">Short to int</label>
    </div>
    </section>

     <section>
    <p>
4. Select the valid statement.</p>

    <div>
        <input type="radio" 
               id="option1" 
               name="array_declaration" 
               value="option1">
        <label for="option1">char[] ch=new char(5)</label>
    </div>

    <div>
        <input type="radio" 
               id="option2" 
               name="array_declaration" 
               value="option2">
        <label for="option2">char[] ch=new char[5]</label>
    </div>

    <div>
        <input type="radio" 
               id="option3" 
               name="array_declaration" 
               value="option3" checked>
        <label for="option3">char[] ch=new char()</label>
    </div>
    <div>
        <input type="radio" 
               id="option4" 
               name="array_declaration" 
               value="option4" checked>
        <label for="option4">char[] ch=new char[]</label>
    </div>
    </section>
     <section>
    <p>
5.  in java are-</p>

    <div>
        <input type="radio" 
               id="option1" 
               name="Arrays" 
               value="option1">
        <label for="option1">Object References</label>
    </div>

    <div>
        <input type="radio" 
               id="option2" 
               name="Arrays" 
               value="option2">
        <label for="option2">objects</label>
    </div>

    <div>
        <input type="radio" 
               id="option3" 
               name="Arrays" 
               value="option3" checked>
        <label for="option3">primitive Data Types</label>
    </div>
    <div>
        <input type="radio" 
               id="option4" 
               name="Arrays" 
               value="option4" checked>
        <label for="option4">None</label>
    </div>
    </section>

</body>
</html>
