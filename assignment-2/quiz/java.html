<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java Questions</title>
  </head>
  <body>
    <form action="html.html">
      <section>
        <p>1. Number of primitive data types in Java are?</p>
        <div>
          <input type="radio" id="q1a" name="datatypes" value="6" required />
          <label for="q1a">6</label>
        </div>
        <div>
          <input type="radio" id="q1b" name="datatypes" value="7" />
          <label for="q1b">7</label>
        </div>
        <div>
          <input type="radio" id="q1c" name="datatypes" value="8" />
          <label for="q1c">8</label>
        </div>
        <div>
          <input type="radio" id="q1d" name="datatypes" value="9" />
          <label for="q1d">9</label>
        </div>
      </section>

      <section>
        <p>2. What is the size of float and double in Java?</p>
        <div>
          <input type="radio" id="q2a" name="size" value="32 and 64" required />
          <label for="q2a">32 and 64</label>
        </div>
        <div>
          <input type="radio" id="q2b" name="size" value="64 and 64" />
          <label for="q2b">64 and 64</label>
        </div>
        <div>
          <input type="radio" id="q2c" name="size" value="32 and 32" />
          <label for="q2c">32 and 32</label>
        </div>
        <div>
          <input type="radio" id="q2d" name="size" value="64 and 32" />
          <label for="q2d">64 and 32</label>
        </div>
      </section>

      <section>
        <p>
          3. Automatic type conversion is possible in which of the possible
          cases?
        </p>
        <div>
          <input
            type="radio"
            id="q3a"
            name="type_conversion"
            value="byte to int"
            required
          />
          <label for="q3a">byte to int</label>
        </div>
        <div>
          <input
            type="radio"
            id="q3b"
            name="type_conversion"
            value="Int to Long"
          />
          <label for="q3b">Int to Long</label>
        </div>
        <div>
          <input
            type="radio"
            id="q3c"
            name="type_conversion"
            value="Long to int"
          />
          <label for="q3c">Long to int</label>
        </div>
        <div>
          <input
            type="radio"
            id="q3d"
            name="type_conversion"
            value="Short to int"
          />
          <label for="q3d">Short to int</label>
        </div>
      </section>

      <section>
        <p>4. Select the valid statement.</p>
        <div>
          <input
            type="radio"
            id="q4a"
            name="array_declaration"
            value="option1"
            required
          />
          <label for="q4a">char[] ch = new char(5)</label>
        </div>
        <div>
          <input
            type="radio"
            id="q4b"
            name="array_declaration"
            value="option2"
          />
          <label for="q4b">char[] ch = new char[5]</label>
        </div>
        <div>
          <input
            type="radio"
            id="q4c"
            name="array_declaration"
            value="option3"
          />
          <label for="q4c">char[] ch = new char()</label>
        </div>
        <div>
          <input
            type="radio"
            id="q4d"
            name="array_declaration"
            value="option4"
          />
          <label for="q4d">char[] ch = new char[]</label>
        </div>
      </section>

      <section>
        <p>5. Arrays in Java are:</p>
        <div>
          <input type="radio" id="q5a" name="Arrays" value="option1" required />
          <label for="q5a">Object References</label>
        </div>
        <div>
          <input type="radio" id="q5b" name="Arrays" value="option2" />
          <label for="q5b">objects</label>
        </div>
        <div>
          <input type="radio" id="q5c" name="Arrays" value="option3" />
          <label for="q5c">primitive Data Types</label>
        </div>
        <div>
          <input type="radio" id="q5d" name="Arrays" value="option4" />
          <label for="q5d">None</label>
        </div>
      </section>

      <button type="submit" style="margin-top: 30px">Next</button>
    </form>
  </body>
</html>
