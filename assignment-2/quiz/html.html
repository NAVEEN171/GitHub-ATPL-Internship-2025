<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Questions</title>
  </head>
  <body>
    <form action="css.html">
      <section>
        <p>1. What does HTML stand for?</p>
        <div>
          <input type="radio" id="q1a" name="q1" value="option1" required />
          <label for="q1a">Hyper Text Markup Language</label>
        </div>
        <div>
          <input type="radio" id="q1b" name="q1" value="option2" />
          <label for="q1b">Home Tool Markup Language</label>
        </div>
        <div>
          <input type="radio" id="q1c" name="q1" value="option3" />
          <label for="q1c">Hyperlinks and Text Markup Language</label>
        </div>
        <div>
          <input type="radio" id="q1d" name="q1" value="option4" />
          <label for="q1d">High Tech Machine Language</label>
        </div>
      </section>

      <section>
        <p>2. Who is the inventor of HTML?</p>
        <div>
          <input type="radio" id="q2a" name="q2" value="option1" required />
          <label for="q2a">Tim Berners-Lee</label>
        </div>
        <div>
          <input type="radio" id="q2b" name="q2" value="option2" />
          <label for="q2b">Bill Gates</label>
        </div>
        <div>
          <input type="radio" id="q2c" name="q2" value="option3" />
          <label for="q2c">Steve Jobs</label>
        </div>
        <div>
          <input type="radio" id="q2d" name="q2" value="option4" />
          <label for="q2d">Dennis Ritchie</label>
        </div>
      </section>

      <section>
        <p>3. Choose the correct HTML element for the largest heading:</p>
        <div>
          <input type="radio" id="q3a" name="q3" value="option1" required />
          <label for="q3a">h1</label>
        </div>
        <div>
          <input type="radio" id="q3b" name="q3" value="option2" />
          <label for="q3b">head</label>
        </div>
        <div>
          <input type="radio" id="q3c" name="q3" value="option3" />
          <label for="q3c">h6</label>
        </div>
        <div>
          <input type="radio" id="q3d" name="q3" value="option4" />
          <label for="q3d">title</label>
        </div>
      </section>

      <section>
        <p>4. Which tag is used to create a hyperlink in HTML?</p>
        <div>
          <input type="radio" id="q4a" name="q4" value="option1" required />
          <label for="q4a">a</label>
        </div>
        <div>
          <input type="radio" id="q4b" name="q4" value="option2" />
          <label for="q4b">link</label>
        </div>
        <div>
          <input type="radio" id="q4c" name="q4" value="option3" />
          <label for="q4c">href</label>
        </div>
        <div>
          <input type="radio" id="q4d" name="q4" value="option4" />
          <label for="q4d">url</label>
        </div>
      </section>

      <section>
        <p>5. Which of the following is a self-closing tag in HTML?</p>
        <div>
          <input type="radio" id="q5a" name="q5" value="option1" required />
          <label for="q5a">br</label>
        </div>
        <div>
          <input type="radio" id="q5b" name="q5" value="option2" />
          <label for="q5b">p</label>
        </div>
        <div>
          <input type="radio" id="q5c" name="q5" value="option3" />
          <label for="q5c">div</label>
        </div>
        <div>
          <input type="radio" id="q5d" name="q5" value="option4" />
          <label for="q5d">section</label>
        </div>
      </section>

      <button type="submit" style="margin-top: 30px">Next</button>
    </form>
  </body>
</html>
