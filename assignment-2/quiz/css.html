<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Questions</title>
  </head>
  <body>
    <form action="thankyou.html">
      <section>
        <p>1. What does CSS stand for?</p>
        <div>
          <input type="radio" id="q1a" name="css1" value="a" required />
          <label for="q1a">Colorful Style Sheets</label>
        </div>
        <div>
          <input type="radio" id="q1b" name="css1" value="b" />
          <label for="q1b">Cascading Style Sheets</label>
        </div>
        <div>
          <input type="radio" id="q1c" name="css1" value="c" />
          <label for="q1c">Computer Style Sheets</label>
        </div>
        <div>
          <input type="radio" id="q1d" name="css1" value="d" />
          <label for="q1d">Creative Style Sheets</label>
        </div>
      </section>

      <section>
        <p>
          2. Where in an HTML document is the correct place to refer to an
          external CSS file?
        </p>
        <div>
          <input type="radio" id="q2a" name="css2" value="a" required />
          <label for="q2a">In the body section</label>
        </div>
        <div>
          <input type="radio" id="q2b" name="css2" value="b" />
          <label for="q2b">In the head section</label>
        </div>
        <div>
          <input type="radio" id="q2c" name="css2" value="c" />
          <label for="q2c">At the end of the document</label>
        </div>
        <div>
          <input type="radio" id="q2d" name="css2" value="d" />
          <label for="q2d">Before the html tag</label>
        </div>
      </section>

      <section>
        <p>3. Which HTML tag is used to define an internal style sheet?</p>
        <div>
          <input type="radio" id="q3a" name="css3" value="a" required />
          <label for="q3a">style</label>
        </div>
        <div>
          <input type="radio" id="q3b" name="css3" value="b" />
          <label for="q3b">css</label>
        </div>
        <div>
          <input type="radio" id="q3c" name="css3" value="c" />
          <label for="q3c">script</label>
        </div>
        <div>
          <input type="radio" id="q3d" name="css3" value="d" />
          <label for="q3d">link</label>
        </div>
      </section>

      <section>
        <p>4. Which property is used to change the text color of an element?</p>
        <div>
          <input type="radio" id="q4a" name="css4" value="a" required />
          <label for="q4a">fgcolor</label>
        </div>
        <div>
          <input type="radio" id="q4b" name="css4" value="b" />
          <label for="q4b">color</label>
        </div>
        <div>
          <input type="radio" id="q4c" name="css4" value="c" />
          <label for="q4c">text-color</label>
        </div>
        <div>
          <input type="radio" id="q4d" name="css4" value="d" />
          <label for="q4d">font-color</label>
        </div>
      </section>

      <section>
        <p>5. Which CSS property controls the text size?</p>
        <div>
          <input type="radio" id="q5a" name="css5" value="a" required />
          <label for="q5a">font-size</label>
        </div>
        <div>
          <input type="radio" id="q5b" name="css5" value="b" />
          <label for="q5b">text-size</label>
        </div>
        <div>
          <input type="radio" id="q5c" name="css5" value="c" />
          <label for="q5c">font-style</label>
        </div>
        <div>
          <input type="radio" id="q5d" name="css5" value="d" />
          <label for="q5d">text-style</label>
        </div>
      </section>

      <button type="submit" style="margin-top: 30px">Submit</button>
    </form>
  </body>
</html>
