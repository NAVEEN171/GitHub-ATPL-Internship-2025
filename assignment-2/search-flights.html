<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Booking</title>
  </head>
  <body>
    <form action="/search">
      <section
        style="display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap"
      >
        <div>
          <label>To : </label>
          <input name="Destination" required />
        </div>
        <div>
          <label>From : </label>
          <input name="Start" required />
        </div>
        <div>
          <label>Departure Date : </label>
          <input type="date" name="Departure Date" required />
        </div>
        <div>
          <label>Return Date : </label>
          <input type="date" name="Return Date" required />
        </div>
        <div>
          <label>Passenger : </label>
          <select name="Passenger" required>
            <option value="">--select--</option>
            <option value="Adults">Adults</option>
            <option value="Children">Children</option>
          </select>
        </div>
      </section>
      <button type="submit" style="margin-top: 10px">Search</button>
    </form>
  </body>
</html>
