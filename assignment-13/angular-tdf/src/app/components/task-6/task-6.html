<section>
  <div class="form-container">
    <h2 class="form-title">Create Account</h2>
    <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)">
      <div class="field-group">
        <label for="username">Username</label>
        <input
          id="username"
          #username="ngModel"
          [(ngModel)]="user.username"
          name="username"
          type="text"
          placeholder="Enter your username"
          required
          class="form-input"
          [class.error]="username.invalid && username.touched"
        />
        <div class="validation-info">
          <span class="validation-item">Touched: {{ username.touched }}</span>
          <span class="validation-item">Dirty: {{ username.dirty }}</span>
          <span class="validation-item" [class.valid]="username.valid"
            >Valid: {{ username.valid }}</span
          >
        </div>
      </div>

      <div class="field-group">
        <label for="email">Email</label>
        <input
          id="email"
          #email="ngModel"
          [(ngModel)]="user.email"
          name="email"
          type="email"
          placeholder="Enter your email"
          pattern="^[^@]+@[^@]+\.[^@]+"
          required
          class="form-input"
          [class.error]="email.invalid && email.touched"
        />
        <div class="validation-info">
          <span class="validation-item">Touched: {{ email.touched }}</span>
          <span class="validation-item">Dirty: {{ email.dirty }}</span>
          <span class="validation-item" [class.valid]="email.valid"
            >Valid: {{ email.valid }}</span
          >
        </div>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input
          id="password"
          #password="ngModel"
          [(ngModel)]="user.password"
          name="password"
          type="password"
          placeholder="Enter your password"
          minlength="6"
          required
          class="form-input"
          [class.error]="password.invalid && password.touched"
        />
        <div class="validation-info">
          <span class="validation-item">Touched: {{ password.touched }}</span>
          <span class="validation-item">Dirty: {{ password.dirty }}</span>
          <span class="validation-item" [class.valid]="password.valid"
            >Valid: {{ password.valid }}</span
          >
        </div>
      </div>

      <button [disabled]="!userForm.valid" type="submit" class="submit-btn">
        Create Account
      </button>
    </form>
  </div>
</section>
