<section class="feedback-container">
  <form
    #feedBackData="ngForm"
    (ngSubmit)="onSubmit(feedBackData)"
    class="feedback-form"
    name="feedbackForm"
  >
    <h2 class="form-title">Feedback Form</h2>

    <div class="form-group">
      <label for="username" class="form-label">Full Name</label>
      <input
        type="text"
        name="username"
        id="username"
        #username="ngModel"
        [(ngModel)]="user.fullName"
        class="form-input"
        placeholder="Enter your full name"
      />
    </div>

    <div class="form-group">
      <label for="comments" class="form-label">Comments</label>
      <textarea
        name="comments"
        id="comments"
        #comments="ngModel"
        [(ngModel)]="user.comments"
        class="form-textarea"
        placeholder="Share your thoughts..."
        rows="4"
      ></textarea>
    </div>

    <div class="form-group">
      <p class="question-title">What is your Experience at ATPL?</p>
      <div class="radio-group">
        <div class="radio-item">
          <input
            type="radio"
            id="q1a"
            name="feedback"
            #feedback="ngModel"
            [(ngModel)]="user.feedbackType"
            value="Good"
            required
          />
          <label for="q1a" class="radio-label">Good</label>
        </div>
        <div class="radio-item">
          <input
            type="radio"
            id="q1b"
            name="feedback"
            value="Average"
            [(ngModel)]="user.feedbackType"
          />
          <label for="q1b" class="radio-label">Average</label>
        </div>
        <div class="radio-item">
          <input
            type="radio"
            id="q1c"
            name="feedback"
            value="Poor"
            [(ngModel)]="user.feedbackType"
          />
          <label for="q1c" class="radio-label">Poor</label>
        </div>
      </div>
    </div>

    @if(feedback.touched || feedback.dirty){ @if(feedback.errors?.['required']){
    <div class="error-message">Feedback is Required</div>
    } }

    <button [disabled]="!feedBackData.valid" type="submit" class="submit-btn">
      Submit Feedback
    </button>
  </form>

  <div *ngIf="feedBackData.submitted" class="success-message">
    <h3>Thank you for your feedback, {{ feedBackData.value.username }}!</h3>
    <p>We will look into it and get back to you.</p>
  </div>
</section>
