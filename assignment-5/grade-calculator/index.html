<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="script.js" defer ></script>
</head>
<body>
    <form id="gradeForm">
      <h1>Check Grades:</h1>
        
      <div><p>English: </p> <input type="number" required max="100" min="0" name="English"></input></div>
      <div><p>Maths:</p> <input type="number" required max="100" min="0" name="Maths"></input></div>
      <div><p>Science:</p> <input type="number" required max="100" min="0" name="Science"></input></div>       
      <div><p>Physical Education:</p> <input type="number" max="100" min="0" name="Physical Education" required></input></div>
      <div><p>Social : </p><input type="number" max="100" min="0" required name="Social" ></input></div>
      <button type="submit" onclick="submitHandler(e)">Submit</button>
      <section></section>
    </form>
    
    
</body>
</html>
