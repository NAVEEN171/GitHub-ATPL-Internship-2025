<h1>current value</h1>
<h3>{{ value }}</h3>
<h1>custom Operations</h1>
<h3>{{ value | operationsby10 : "multiply" : "INR" }}</h3>
<h3>{{ value | operationsby10 : "add" : "USD" }}</h3>
<h3>{{ value | operationsby10 : "divide" : "USD" }}</h3>
<h3>{{ value | operationsby10 : "subtract" : "INR" }}</h3>
