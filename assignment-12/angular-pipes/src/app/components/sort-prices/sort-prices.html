<div class="array-container">
  <h1 class="array-title">Original Array</h1>
  <div class="array-formatter">
    <div
      class="array-item"
      [ngClass]="
        idx === 0 || idx === itemPrices.length - 1
          ? 'bracket'
          : idx !== 0 && idx !== itemPrices.length - 1
          ? 'number'
          : ''
      "
      *ngFor="let item of itemPrices; let idx = index; $track: idx"
    >
      {{
        idx === 0
          ? "[" + item + " , "
          : idx === itemPrices.length - 1
          ? item + " ]"
          : item + " , "
      }}
    </div>
  </div>

  <div class="sorted-array">
    <h1 class="array-title">Sorted Array with Slicing</h1>
    <div class="array-formatter">
      <div
        class="array-item"
        [ngClass]="
          idx === 0 || idx === 4
            ? 'bracket'
            : idx !== 0 && idx !== 4
            ? 'number'
            : ''
        "
        *ngFor="
          let item of SortedArray | slice : 0 : 5;
          let idx = index;
          $track: idx
        "
      >
        {{
          idx === 0
            ? "[" + item + " , "
            : idx === 4
            ? item + " ]"
            : item + " , "
        }}
      </div>
    </div>
  </div>
</div>
