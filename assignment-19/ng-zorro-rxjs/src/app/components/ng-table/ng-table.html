<button class="refresh-btn" (click)="refreshUsers()">Refresh</button>
<nz-table #basicTable [nzData]="users">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Company</th>
      <th>City</th>
    </tr>
  </thead>
  <tbody>
    @for (data of basicTable.data; track data) {
    <tr>
      <td>{{ data.name }}</td>
      <td>{{ data.email }}</td>
      <td>{{ data.company }}</td>
      <td>{{ data.city }}</td>
    </tr>
    }
  </tbody>
</nz-table>
