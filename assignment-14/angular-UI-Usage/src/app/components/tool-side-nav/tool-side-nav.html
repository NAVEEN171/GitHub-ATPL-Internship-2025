<mat-toolbar class="tool-tip">
  <button
    matIconButton
    (click)="sidenav.toggle()"
    class="example-icon"
    aria-label="Example icon-button with menu icon"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <span>Angular Project</span>
  <mat-slide-toggle (click)="toggleTheme()">
    <p class="toggler">
      {{ !darkMode ? "turn dark Mode" : "turn light Mode" }}
    </p></mat-slide-toggle
  >
</mat-toolbar>

<mat-sidenav-container class="example-container" autosize>
  <mat-sidenav #sidenav mode="side" [(opened)]="opened">
    <mat-sidenav-content class="side-bar-content">
      <h2>Pages</h2>
    </mat-sidenav-content>
    <div class="example-events">
      @for (e of events; track e) {
      <button type="button" [routerLink]="e.route">{{ e.name }}</button>
      }
      <div
        (click)="openFlipkartFrame()"
        class="m-auto mt-4 cursor-pointer w-[20px] h-[20px]"
      >
        <img
          src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/flipkart-icon.png"
          alt="flipkart-logo"
        />
      </div>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
<div class="text-center mt-5 font-bold text-2xl">
  <div *ngIf="needOutlet">
    <router-outlet></router-outlet>
  </div>
</div>
