<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Table</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="subscription-cards">
      <div class="subscription-card">
        
          <h2 class="header">Basic</h2>
          <h1>$0/mon</h1>        
      
        <button class="subscribe">Choose Plan</button>
      </div>
      <div class="subscription-card">
     
          <h2 class="header">Standard</h2>
          <h1>$19/mon</h1>

        <button class="subscribe">Choose Plan</button>
      </div>
      <div class="subscription-card">
        
          <h2 class="header">Premium</h2>
          <h1>$29/mon</h1>
          
        <button class="subscribe">Choose Plan</button>
      </div>
    </div>
  </body>
</html>
